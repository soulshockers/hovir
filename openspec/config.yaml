schema: spec-driven

context: |
  Language: uk
  All artifacts must be written in uk.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Requirements live only in openspec/: openspec/specs/ (реалізована поведінка) і openspec/changes/<name>/
  (заплановані зрізи: proposal.md, design.md, specs/). Окремого документа-джерела вимог немає.
  Кожна зміна посилається на інші зміни/спеки за шляхом в openspec/, а не на зовнішні документи.

  ## Огляд продукту
  Open-source платформа для створення та проведення інтерактивних презентацій на кшталт Mentimeter/Kahoot
  (назва — Hovir, від «говір»: гомін і голос зали).
  - Модель поширення: будь-хто розгортає власний інстанс кнопкою «Deploy to Vercel» з README на GitHub.
    Після деплою отримує готовий сервіс для навчального закладу чи одного виступу. Усе має працювати на
    безкоштовних тарифах (Vercel Hobby + Supabase Free).
  - Сценарій: доповідач на сцені відкриває презентацію і стартує сесію. Слухачі сканують QR-код (його видно
    на будь-якому слайді) або вводять 6-значний код сесії на сайті й отримують автогенерований нік. Далі вони
    беруть участь в опитуваннях, квізах і міні-іграх. Під час гри екран доповідача показує scoreboard у реальному часі.
  - Розширюваність: типи слайдів реалізовано як плагіни з єдиним контрактом. Перший «демонстраційний» плагін —
    гра «Бики та корови» для розігріву.
  - Масштаб: до 100 учасників на сесію.
  - Терміни: MVP — за 1–3 місяці.

  Принципи:
  1. Zero-config після деплою: немає обов'язкових OAuth-клієнтів і SMTP; мінімум env-змінних.
  2. Сервер — джерело істини: уся ігрова логіка та секрети (задумані числа, правильні відповіді) живуть лише на сервері.
  3. Без персональних даних: слухачі анонімні, доповідачі не мають акаунтів.
  Похідні правила: без акаунтів (edit/present-токени, у БД лише SHA-256 хеші); клієнти лише читають
  realtime-канал, усі дії йдуть через HTTP API.

  Ролі (деталі — openspec/specs/presentation-access, openspec/specs/instance-admin): власник інстансу (`INSTANCE_PASSWORD`, `/admin`),
  автор/редактор (`/e/<editToken>`), доповідач (`/p/<presentToken>`), слухач (код сесії / QR → `/<code>` або `/join`).

  ## Стек (рішення)
  | Шар | Вибір |
  |---|---|
  | Фреймворк | Next.js (App Router) + TypeScript, React |
  | Хостинг | Vercel (Hobby, кнопка «Deploy to Vercel»); лише Vercel у MVP |
  | БД | Supabase Postgres (підключення через Vercel Marketplace) |
  | Realtime | Supabase Realtime: Broadcast (події та стан), Presence (online-учасники) |
  | Файли | Supabase Storage (зображення слайдів, логотипи) |
  | ORM / міграції | Drizzle ORM + SQL-міграції drizzle-kit, застосовуються в білді (обрано в bootstrap-platform; альтернативою розглядались Supabase SQL-міграції) |
  | Валідація | zod (спільно: конфіги плагінів, API) |
  | UI | Tailwind CSS; анімації — Framer Motion; конфеті — canvas-confetti; QR — бібліотека генерації QR на клієнті |
  | i18n | next-intl (або аналог), мови `uk` та `en` |
  | Тести | Vitest (unit, логіка плагінів), Playwright (e2e: доповідач + кілька слухачів) |
  | Адмінка | Власний редактор у Next.js. Keystone.js і AdminJS відхилено |
  Менеджер пакетів — pnpm; один пакет у корені репо з папкою `plugins/`.

  Адмінка: власний редактор у Next.js, бо це один деплой, без акаунтів (edit-токени), форми генеруються з
  zod-схем плагінів, live-превʼю тими самими компонентами. Keystone.js і AdminJS відхилено: потребують
  окремого Node/Express-сервера й погано вписуються у Vercel serverless (повне порівняння —
  openspec/changes/add-presentation-editor/design.md).

  ## Realtime: чому не socket.io
  Vercel Functions — serverless і не тримають постійних WebSocket-з'єднань, тож socket.io-сервер там запустити
  неможливо; окремий long-running сервер (Railway/Fly/Render) суперечить ідеї деплою «в один клік на
  безкоштовний хостинг». Тому realtime надає Supabase Realtime: та сама послуга, що й БД, одна інтеграція,
  безкоштовний тариф. socket.io НЕ використовується.
  Потік даних (деталі — openspec/changes/add-live-sessions/design.md): клієнт → HTTP `POST /api/sessions/:id/actions`
  → route перевіряє токен, у транзакції `SELECT … FOR UPDATE` стану слайда, `plugin.server.handleAction`, збереження →
  відповідь актору в HTTP-відповіді → сервер публікує `PublicState`/події в канал `session:<id>` через
  Broadcast (server-side, з throttling) → клієнти підписані лише на читання. Presence — лічильник online у лобі.
  Знімок стану `GET /api/sessions/:id/state` — для першого завантаження й після перепідключення.

  Плагіни слайдів: папка `plugins/<id>/`, реєстр `plugins/index.ts`, контракт `SlidePlugin` (zod-схема конфігу,
  компоненти Presenter/Audience, server handleAction, toPublic/toPlayer, scoring) —
  openspec/specs/slide-plugin-contract, openspec/specs/slide-plugin-runtime.

  ## Ліміти безкоштовних тарифів (орієнтовно; перевірити актуальні значення перед релізом)
  - Supabase Free: ~200 одночасних Realtime-з'єднань, обмеження на кількість повідомлень за секунду і за
    місяць (кожна доставка кожному клієнту рахується як повідомлення), 500 МБ БД, 1 ГБ Storage. Free-проєкт
    призупиняється після 7 днів неактивності (див. «Відкриті питання», п. 1).
  - Vercel Hobby: ліміти на виклики й тривалість функцій. Тарифний план Hobby призначений для некомерційного
    використання (заклади мають самі оцінити, чи підходить їм він, чи потрібен Pro).
  - Для 100 учасників розрахунок такий: throttling 2 повідомлення/с × 100 клієнтів = ~200 доставок/с у пік гри.
    Тому трансляції стану агрегуються, а персональні дані йдуть через HTTP-відповіді, а не через broadcast.
    Ліміти потрібно перевірити навантажувальним тестом (openspec/changes/add-quality-gates).

  ## Нефункціональні вимоги
  - Вартість: $0 на безкоштовних тарифах Vercel Hobby + Supabase Free для сценарію «до 100 учасників,
    кілька сесій на тиждень».
  - Затримка: оновлення scoreboard на екрані доповідача ≤ 1 с; відповідь на спробу/голос ≤ 500 мс (p95, у межах регіону).
  - Мобільний досвід слухача: mobile-first, працює в мобільних Safari/Chrome без встановлення, великі зони
    натискання, цифрова клавіатура для «Биків».
  - Безпека: токени ≥128 біт, у БД зберігаються лише хеші; уся ігрова логіка на сервері; RLS закриває таблиці
    від анонімного доступу; rate limiting на join та actions; валідація всіх вхідних даних через zod;
    CSP-заголовки; Markdown рендериться без сирого HTML.
  - Доступність: контраст тем ≥ WCAG AA; бики й корови позначаються не лише кольором, а й формою або
    підписом (для дальтоніків).
  - Надійність: перезавантаження будь-якого клієнта не втрачає стану; сесія переживає перезапуск функцій (стан у БД).
  - Персональні дані: немає (анонімні ніки, без IP в БД).

  ## Дорожня карта MVP (1–3 місяці), за пріоритетом реалізації
  Кожен пункт — окрема зміна в openspec/changes/ (у дужках — зміст):
  P0 — ядро та демо-флоу:
  1. bootstrap-platform (реалізовано) — деплой кнопкою на Vercel + Supabase, автоміграції, README з інструкцією, /health.
  2. add-presentation-access — створення презентації, edit/present-посилання, «Мої презентації» (localStorage),
     `INSTANCE_PASSWORD` і майстер-доступ `/admin`.
  3. add-slide-plugin-system — контракт плагінів + реєстр + тест-хелпер безпеки.
  4. add-presentation-editor — редактор: список слайдів, форми з zod-схем, превʼю, автозбереження.
  5. add-live-sessions — сесії: старт, код + QR, лобі, перемикання слайдів, завершення, автоперепідключення, кік учасника.
  6. add-static-and-poll-slides — плагіни `static`, `poll`.
  7. add-bulls-and-cows — плагін `bulls-and-cows`.
  8. add-session-leaderboard — скрізний лідерборд + слайд `leaderboard`.
  P1:
  9. add-quiz-slide — плагін `quiz`.
  10. add-wordcloud-and-moderation — плагін `wordcloud` (з фільтром і приховуванням).
  11. add-themes-and-presenter-controls — теми (3 пресети + акцент + логотип), повноекранний режим, клавіатура/клікер.
  12. add-i18n — i18n uk/en.
  P2 (у межах MVP, якщо вистачає часу):
  13. add-scale-and-qna-slides — плагіни `scale`, `qna`.
  14. add-presentation-effects — анімації, конфеті, звуки з mute.
  15. add-session-history-and-export — історія сесій, експорт CSV, автовидалення.
  Якість (паралельно з усім):
  16. add-quality-gates — unit-тести логіки всіх плагінів (особливо підрахунок биків/корів і рейтинг);
      E2E Playwright: доповідач + 3–5 слухачів проходять повний сценарій; навантажувальний скрипт: 100 віртуальних
      слухачів на одній сесії; CSP-заголовки; Markdown без сирого HTML.

  Подальші етапи (поза MVP, змін під них ще немає):
  - Кнопка деплою на Netlify; docker-compose для self-host (з можливим socket.io-адаптером realtime).
  - Абстракція realtime-адаптера (Supabase / Ably / socket.io).
  - Плагіни як окремі npm-пакети, каталог плагінів.
  - Нові типи: квіз з кількома правильними відповідями, ранжування, відкриті відповіді, командні режими.
  - Пульт доповідача на телефоні, нотатки доповідача.
  - Імпорт/експорт презентацій (JSON), шаблони.
  - Опційні акаунти (Google OAuth / magic link) для синхронізації «Моїх презентацій» між пристроями.

  ## Відкриті питання
  1. Сплячий Supabase Free. Безкоштовний проєкт Supabase призупиняється після 7 днів неактивності. Як гарантувати,
     що перед івентом інстанс «прокинеться»? Варіанти:
     - перевірка стану на головній сторінці з інструкцією «відновіть проєкт у дашборді Supabase»;
     - Vercel Cron-пінг раз на добу (чи вважається це активністю за правилами Supabase — перевірити);
     - пункт у чек-листі доповідача «відкрити present-посилання за день до виступу».
     Стан: перший і третій варіанти реалізовано в bootstrap-platform (`/health`, банер, чек-лист у README);
     Cron-пінг відкладено до перевірки правил Supabase.
  2. Кілька пристроїв з одним present-посиланням. Якщо present-посилання відкрити на двох пристроях (наприклад,
     ноутбук на проєкторі та телефон як пульт), хто керує сесією? Варіанти:
     - усі рівноправні (останній клік виграє, стан синхронізується через канал);
     - один «головний» екран + решта в режимі пульта/дзеркала;
     - лише один активний пристрій, інші бачать «Сесія керується з іншого пристрою — перехопити?».
     Вирішується в openspec/changes/add-live-sessions/design.md.

